services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/competra
      DB_USER: competra
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ktor_server}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ktor_audience}
      RABBITMQ_URI: amqp://competra:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USER_ID: ${LOKI_USER_ID:-}
      LOKI_API_KEY: ${LOKI_API_KEY:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-competra}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # Процесс онлайн-трекинга: тот же образ, APP_MODE=tracking. Отдельный контейнер с потолком
  # памяти/CPU — его сбой не задевает приём финиша и результатов в app (см. спеку live-tracking).
  # БД competra_tracking и роли готовит scripts/setup_tracking_db.sh (он же генерирует пароли в .env).
  tracking:
    build: .
    ports:
      - "8081:8080"
    environment:
      APP_MODE: tracking
      TRACKING_DB_URL: jdbc:postgresql://postgres:5432/competra_tracking
      TRACKING_DB_USER: competra_tracking
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD:-}
      MAIN_RO_DB_URL: jdbc:postgresql://postgres:5432/competra
      MAIN_RO_DB_USER: competra_tracking_ro
      MAIN_RO_DB_PASSWORD: ${TRACKING_RO_DB_PASSWORD:-}
      # result.saved из app закрывает трек финишировавшего; без брокера — закрытие по таймауту.
      RABBITMQ_URI: amqp://competra:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ktor_server}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ktor_audience}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USER_ID: ${LOKI_USER_ID:-}
      LOKI_API_KEY: ${LOKI_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: competra
      POSTGRES_USER: competra
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competra -d competra"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: competra
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/docker-entrypoint-reload.sh:/docker-entrypoint-reload.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint-reload.sh"]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --quiet --deploy-hook 'touch /etc/letsencrypt/renewed'; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
